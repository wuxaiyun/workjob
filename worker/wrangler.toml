name = "equipment-ledger"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# 一体化部署：前端构建产物同步到 public/ 后，由 Worker 一并托管
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# 非敏感变量；JWT_SECRET / FILE_ACCESS_SECRET 通过 `wrangler secret put` 设置，
# 本地开发时请在 worker/.dev.vars 中提供同名变量（不要写在这里，避免部署时覆盖生产密钥）
[vars]
JWT_EXPIRES_IN = "7d"

[[d1_databases]]
binding = "DB"
database_name = "equipment-ledger-db"
database_id = "b8e88498-76f8-430c-bec4-a09ed144ab10"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "equipment-ledger-photos"

[[routes]]
pattern = "xiaobaikejizhan.dpdns.org"
custom_domain = true

[observability]
enabled = true