name = "equipment-ledger"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 一体化部署：前端构建产物同步到 public/ 后，由 Worker 一并托管
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# 本地开发变量（部署时请用环境变量覆盖，不要提交真实密钥）
[vars]
JWT_SECRET = "dev-secret-change-me"
JWT_EXPIRES_IN = "7d"

[[d1_databases]]
binding = "DB"
database_name = "equipment-ledger-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "equipment-ledger-photos"

[observability]
enabled = true